[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "avulse"
version = "0.0.0"
description = "Divert, modify and re-inject network packets on Linux, Windows and macOS."
readme = "README.md"
requires-python = ">=3.10"
license = "LGPL-3.0-or-later OR GPL-2.0-or-later"
authors = [{ name = "Fabio Falcinelli", email = "fabio.falcinelli@gmail.com" }]
keywords = ["windivert", "packet", "divert", "ebpf", "firewall"]
classifiers = [
    "Development Status :: 1 - Planning",
    "Topic :: System :: Networking",
    "Programming Language :: Python :: 3",
]

[project.urls]
Homepage = "https://github.com/ffalcinelli/avulse"
Repository = "https://github.com/ffalcinelli/avulse"
