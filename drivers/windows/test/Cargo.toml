# Tests the driver from user mode through its control device (drivers/windows/scripts/test.ps1).
# Windows only; outside the main workspace.
[package]
name = "avulse-driver-test"
description = "Tests avulse.sys through its IOCTLs."
version = "0.0.0"
edition = "2024"
license = "LGPL-3.0-or-later OR GPL-2.0-or-later"
publish = false

[dependencies]
avulse-abi = { path = "../../../crates/abi" }
avulse-filter = { path = "../../../crates/filter" }
windows-sys = { version = "0.60", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
] }

[workspace]
