[package]
name = "avulse-windivert-compat"
description = "WinDivert-compatible API shim over avulse."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[lints]
workspace = true

[lib]
# `libavulse_windivert.so`. The rlib is for the tests: no crate links this one.
name = "avulse_windivert"
crate-type = ["cdylib", "rlib"]

[dependencies]
avulse = { path = "../avulse", version = "0.0.0" }
avulse-abi.workspace = true
avulse-filter.workspace = true
avulse-proto.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_IO",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
] }
