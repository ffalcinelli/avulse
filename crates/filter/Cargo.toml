[package]
name = "avulse-filter"
description = "Filter language: parser, type checker, IR, bytecode verifier and interpreter."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true
readme = "README.md"
homepage = "https://ffalcinelli.github.io/avulse/"
keywords = ["packet", "wireshark", "filter", "no-std", "network"]
categories = ["network-programming", "parser-implementations", "no-std"]

[features]
# `matches` / `~` (regular expressions). It runs in user space only: kernel backends fall back to
# user space for filters that use it. The crate stays `no_std` either way.
regex = ["dep:regex-automata"]

[dependencies]
avulse-proto.workspace = true
regex-automata = { version = "0.4.18", optional = true, default-features = false, features = [
    "alloc",
    "syntax",
    "meta",
    "nfa-pikevm",
    "hybrid",
] }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true

[dev-dependencies]
# The differential test of the bytecode against the IR evaluator.
proptest = { version = "1.12", default-features = false, features = ["std"] }
