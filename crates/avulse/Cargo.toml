[package]
name = "avulse"
description = "Divert, modify and re-inject network packets on Linux, Windows and macOS."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = true
readme = "README.md"
keywords = ["windivert", "packet", "divert", "ebpf", "firewall"]
categories = ["network-programming", "os"]

[dependencies]
avulse-abi.workspace = true
# User space evaluates `matches` filters too (the fallback when the kernel cannot run a filter).
avulse-filter = { workspace = true, features = ["regex"] }
avulse-proto.workspace = true

# The Linux backend: the eBPF programs, their loader and the matcher generator.
[target.'cfg(target_os = "linux")'.dependencies]
avulse-ebpf.workspace = true
libc = "0.2"

[lints]
workspace = true
