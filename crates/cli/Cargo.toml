[package]
name = "avulse-cli"
description = "Command-line tool: capture, inject and filter check/explain/fmt/convert."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[lints]
workspace = true

[[bin]]
name = "avulse"
path = "src/main.rs"
# The library `avulse` has the same name; its documentation is the one published.
doc = false

[dependencies]
avulse = { path = "../avulse" }
avulse-filter = { workspace = true, features = ["regex"] }
avulse-proto.workspace = true
clap = { version = "4.6.7", features = ["derive"] }
