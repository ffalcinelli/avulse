[package]
name = "avulse-capi"
description = "C ABI for libavulse."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[lints]
workspace = true

[lib]
name = "avulse"
# No rlib: it would collide with the `avulse` crate's. The API is documented by the C header,
# `include/avulse.h`.
crate-type = ["cdylib", "staticlib"]
doc = false

[dependencies]
avulse-rs = { package = "avulse", path = "../avulse", version = "0.0.0" }
avulse-filter.workspace = true
avulse-proto.workspace = true
