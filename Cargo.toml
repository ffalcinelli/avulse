[workspace]
resolver = "3"
exclude = ["fuzz", "spikes", "drivers"]
members = [
    "crates/proto",
    "crates/filter",
    "crates/abi",
    "crates/ebpf",
    "crates/avulse",
    "crates/capi",
    "crates/windivert-compat",
    "crates/macos-ext",
    "crates/cli",
    "crates/wasm",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "LGPL-3.0-or-later OR GPL-2.0-or-later"
repository = "https://github.com/ffalcinelli/avulse"
authors = ["Fabio Falcinelli <fabio.falcinelli@gmail.com>"]
publish = false

[workspace.dependencies]
avulse-proto = { path = "crates/proto", version = "0.0.0" }
avulse-filter = { path = "crates/filter", version = "0.0.0" }
avulse-abi = { path = "crates/abi", version = "0.0.0" }
avulse-ebpf = { path = "crates/ebpf", version = "0.0.0" }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
