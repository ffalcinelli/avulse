# Fuzz targets, run with cargo-fuzz (see CLAUDE.md for the commands). Kept out of the workspace:
# they need libFuzzer and a nightly compiler (or RUSTC_BOOTSTRAP=1).
[package]
name = "avulse-fuzz"
version = "0.0.0"
edition = "2024"
license = "LGPL-3.0-or-later OR GPL-2.0-or-later"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
avulse-proto = { path = "../crates/proto" }
avulse-filter = { path = "../crates/filter", features = ["regex"] }

[[bin]]
name = "bytecode"
path = "fuzz_targets/bytecode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "filter"
path = "fuzz_targets/filter.rs"
test = false
doc = false
bench = false

[[bin]]
name = "windivert"
path = "fuzz_targets/windivert.rs"
test = false
doc = false
bench = false
